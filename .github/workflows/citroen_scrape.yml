name: Citroen Daily Scrape

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Nowy run anuluje zawieszony stary — wiszący run nie nadpisze świeżych danych
concurrency:
  group: citroen-scrape
  cancel-in-progress: true

jobs:
  update-citroen:
    runs-on: ubuntu-latest
    # API SFS zamiast Selenium — Chrome zostaje tylko dla ścieżki awaryjnej.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4 selenium python-dotenv
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: mkdir -p data/images
      - name: Run Citroen Inventory Scraper
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: PYTHONPATH=. python scrapers/citroen_inventory.py
      # feed modelowy jest dodatkiem: jego awaria (np. 403 z Akamai)
      # nie może blokować commita i Gista działającego feedu stockowego
      - name: Run Citroen Model Feed
        continue-on-error: true
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: PYTHONPATH=. python scrapers/citroen_model.py
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A data/citroen_* data/images || true
          git commit -m "Auto: update Citroen feeds [skip ci]" || true
          # Pętla na wypadek równoległych pushy innych workflowów; po 5
          # nieudanych próbach job ma być czerwony — inaczej Gist dostaje CSV
          # z linkami do zdjęć, których nie ma w repo
          pushed=0
          for i in {1..5}; do
            if git pull --rebase origin master && git push origin master; then pushed=1; break; fi
            sleep 10
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::Push nie powiódł się po 5 próbach"
            git status --short | head -20
            exit 1
          fi
      - name: Update Citroen Osobowe Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: fd0b6520af36117e3290271d540a085b
          file_path: data/citroen_osobowe_inventory.csv
      - name: Update Citroen LCV Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: 24fe8de6e88cdc4ad55dabee9f2095f2
          file_path: data/citroen_lcv_inventory.csv
      # Feedy modelowe lądują w repo; żeby trafiały też do Gistów, załóż nowe
      # Gisty i wklej ich id poniżej (bez tego kroki zwróciłyby 404).
      # - name: Update Citroen Osobowe Model Gist
      #   uses: exuanbo/actions-deploy-gist@v1
      #   with:
      #     token: ${{ secrets.GIST_TOKEN }}
      #     gist_id: TODO_ID_GISTA
      #     file_path: data/citroen_osobowe_model.csv
      # - name: Update Citroen Dostawcze Model Gist
      #   uses: exuanbo/actions-deploy-gist@v1
      #   with:
      #     token: ${{ secrets.GIST_TOKEN }}
      #     gist_id: TODO_ID_GISTA
