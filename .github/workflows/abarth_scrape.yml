name: Abarth Daily Scrape

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Nowy run anuluje zawieszony stary — wiszący run nie nadpisze świeżych danych
concurrency:
  group: abarth-scrape
  cancel-in-progress: true

jobs:
  update-abarth:
    runs-on: ubuntu-latest
    # Abarth to trzy modele w cenniku i zwykle pusty stock — starczy krócej
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # curl_cffi — feed modelowy czyta abarth.pl, a ten stoi za Akamai
      - run: pip install requests beautifulsoup4 python-dotenv curl_cffi
      - run: mkdir -p data
      - name: Run Abarth Inventory Scraper
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: PYTHONPATH=. python scrapers/abarth_inventory.py
      # feed modelowy jest dodatkiem: jego awaria (np. 403 z Akamai)
      # nie może blokować commita i Gista działającego feedu stockowego
      - name: Run Abarth Model Feed
        continue-on-error: true
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: PYTHONPATH=. python scrapers/abarth_model.py
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A data/abarth_* || true
          git commit -m "Auto: update Abarth feeds [skip ci]" || true
          # Pętla na wypadek równoległych pushy innych workflowów; po 5
          # nieudanych próbach job ma być czerwony — inaczej Gist dostaje CSV
          # z linkami do zdjęć, których nie ma w repo
          pushed=0
          for i in {1..5}; do
            if git pull --rebase origin master && git push origin master; then pushed=1; break; fi
            sleep 10
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::Push nie powiódł się po 5 próbach"
            git status --short | head -20
            exit 1
          fi
      # Feedy lądują w repo; żeby trafiały też do Gistów, załóż nowe Gisty
      # i wklej ich id poniżej (bez tego kroki zwróciłyby 404).
      # - name: Update Abarth Inventory Gist
      #   uses: exuanbo/actions-deploy-gist@v1
      #   with:
      #     token: ${{ secrets.GIST_TOKEN }}
      #     gist_id: TODO_ID_GISTA
      #     file_path: data/abarth_inventory.csv
      # - name: Update Abarth Model Gist
      #   uses: exuanbo/actions-deploy-gist@v1
      #   with:
      #     token: ${{ secrets.GIST_TOKEN }}
      #     gist_id: TODO_ID_GISTA
      #     file_path: data/abarth_model.csv
