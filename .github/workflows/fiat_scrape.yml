name: Fiat Daily Scrape

on:
  schedule:
    - cron: '45 */4 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Nowy run anuluje zawieszony stary — wiszący run nie nadpisze świeżych danych
concurrency:
  group: fiat-scrape
  cancel-in-progress: true

jobs:
  update-fiat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # curl_cffi — feed modelowy czyta fiat.pl, a ten stoi za Akamai
      - run: pip install requests beautifulsoup4 python-dotenv curl_cffi
      - run: mkdir -p data
      - name: Run Fiat Inventory Scraper
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: PYTHONPATH=. python scrapers/fiat_inventory.py
      # feed modelowy jest dodatkiem: jego awaria (np. 403 z Akamai)
      # nie może blokować commita i Gista działającego feedu stockowego
      - name: Run Fiat Model Feed
        continue-on-error: true
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: PYTHONPATH=. python scrapers/fiat_model.py
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/fiat_* || true
          git commit -m "Auto: update Fiat feeds [skip ci]" || true
          for i in {1..5}; do
            git pull --rebase origin master && git push origin master && break || sleep 10
          done
      - name: Update Fiat Osobowe Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: 785c11ed1c27b455acb0e0a5dabc00fb
          file_path: data/fiat_osobowe_inventory.csv
      - name: Update Fiat LCV Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: cb240c966485b6d3767712f3fbcc637a
          file_path: data/fiat_lcv_inventory.csv
      # Feed modelowy ląduje w repo; żeby trafiał też do Gista, załóż nowy
      # Gist i wklej jego id poniżej (bez tego krok zwróciłby 404).
      # - name: Update Fiat Model Gist
      #   uses: exuanbo/actions-deploy-gist@v1
      #   with:
      #     token: ${{ secrets.GIST_TOKEN }}
      #     gist_id: TODO_ID_GISTA
      #     file_path: data/fiat_osobowe_model.csv
